kind = "api"
previewPath = "/api" # TODO - should be excluded from preview in the first place
title = "API Server"
version = "1.0.0"
id = "3B4_FFSkEVBkAeYMFRJ2e"

[[services]]
localPort = 8080
name = "API Server"
paths = ["/api"]

[services.development]
run = "cd /home/runner/workspace && uv run alembic -c /home/runner/workspace/alembic.ini upgrade head && uv run python -m backend.seed && uv run uvicorn backend.app.main:app --host 0.0.0.0 --port $PORT"

[services.production]

[services.production.build]
args = ["sh", "-c", "cd /home/runner/workspace && uv run alembic -c /home/runner/workspace/alembic.ini upgrade head && uv run python -m backend.seed"]

[services.production.build.env]
NODE_ENV = "production"

[services.production.run]
# we don't run through pnpm to make startup faster in production
args = ["sh", "-c", "cd /home/runner/workspace && exec uv run uvicorn backend.app.main:app --host 0.0.0.0 --port $PORT"]

[services.production.run.env]
PORT = "8080"
NODE_ENV = "production"

[services.production.health.startup]
path = "/api/healthz"
