        id:
          type: number
        username:
          type: string
        display_name:
          type: string
        role_id:
          type: number
        role_name:
          type: string
        permissions:
          type: array
          items:
            type: string
        is_active:
          type: boolean
      required: [id, username, display_name, role_id, role_name, permissions, is_active]
    User:
      type: object
      properties:
        id:
          type: number
        username:
          type: string
        display_name:
          type: string
        role_id:
          type: number
        role_name:
          type: string
        is_active:
