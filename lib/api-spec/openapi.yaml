openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: auth
    description: Authentication and session operations
  - name: dashboard
    description: Initial dashboard summary
  - name: users
    description: User administration
  - name: access
    description: Roles and permissions
  - name: warehouses
    description: Warehouse administration
  - name: departments
    description: Department administration
  - name: items
    description: Item catalog administration
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /auth/login:
    post:
      operationId: login
      tags: [auth]
      summary: Sign in
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginInput"
      responses:
        "200":
          description: Authenticated user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SessionUser"
        "401":
          description: Invalid credentials
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /auth/logout:
    post:
      operationId: logout
      tags: [auth]
      summary: Sign out
      responses:
        "200":
          description: Session ended
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageResponse"
  /auth/me:
    get:
      operationId: getCurrentUser
      tags: [auth]
      summary: Get current user
      responses:
        "200":
          description: Current authenticated user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SessionUser"
        "401":
          description: Authentication required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /dashboard/summary:
    get:
      operationId: getDashboardSummary
      tags: [dashboard]
      summary: Get initial dashboard summary
      responses:
        "200":
          description: Dashboard summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DashboardSummary"
        "401":
          description: Authentication required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /users:
    get:
      operationId: listUsers
      tags: [users]
      summary: List users
      responses:
        "200":
          description: Users
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/User"
        "401":
          description: Authentication required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Permission denied
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    post:
      operationId: createUser
      tags: [users]
      summary: Create user
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UserInput"
      responses:
        "201":
          description: Created user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "400":
          description: Invalid or duplicate user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Authentication required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Permission denied
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /users/{userId}:
    patch:
      operationId: updateUser
      tags: [users]
      summary: Update user
      parameters:
        - name: userId
          in: path
          required: true
          schema:
            type: number
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UserUpdate"
      responses:
        "200":
          description: Updated user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "400":
          description: Invalid or duplicate user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Authentication required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Permission denied
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: User not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /roles:
    get:
      operationId: listRoles
      tags: [access]
      summary: List roles
      responses:
        "200":
          description: Roles
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Role"
        "401":
          description: Authentication required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /permissions:
    get:
      operationId: listPermissions
      tags: [access]
      summary: List permissions
      responses:
        "200":
          description: Permissions
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Permission"
        "401":
          description: Authentication required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /warehouses:
    get:
      operationId: listWarehouses
      tags: [warehouses]
      summary: List warehouses
      responses:
        "200":
          description: Warehouses
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Warehouse"
        "401":
          description: Authentication required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Permission denied
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    post:
      operationId: createWarehouse
      tags: [warehouses]
      summary: Create warehouse
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WarehouseInput"
      responses:
        "201":
          description: Created warehouse
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Warehouse"
        "400":
          description: Invalid or duplicate warehouse
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Authentication required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Permission denied
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /warehouses/{warehouseId}:
    patch:
      operationId: updateWarehouse
      tags: [warehouses]
      summary: Update warehouse
      parameters:
        - name: warehouseId
          in: path
          required: true
          schema:
            type: number
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WarehouseUpdate"
      responses:
        "200":
          description: Updated warehouse
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Warehouse"
        "400":
          description: Invalid or duplicate warehouse
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Authentication required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Permission denied
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Warehouse not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /departments:
    get:
      operationId: listDepartments
      tags: [departments]
      summary: List departments
      responses:
        "200":
          description: Departments
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Department"
        "401":
          description: Authentication required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Permission denied
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    post:
      operationId: createDepartment
      tags: [departments]
      summary: Create department
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DepartmentInput"
      responses:
        "201":
          description: Created department
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Department"
        "400":
          description: Invalid or duplicate department
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Authentication required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Permission denied
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /departments/{departmentId}:
    patch:
      operationId: updateDepartment
      tags: [departments]
      summary: Update department
      parameters:
        - name: departmentId
          in: path
          required: true
          schema:
            type: number
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DepartmentUpdate"
      responses:
        "200":
          description: Updated department
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Department"
        "400":
          description: Invalid or duplicate department
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Authentication required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Permission denied
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Department not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /items:
    get:
      operationId: listItems
      tags: [items]
      summary: List items
      parameters:
        - name: search
          in: query
          required: false
          schema:
            type: string
        - name: warehouseId
          in: query
          required: false
          schema:
            type: number
        - name: isActive
          in: query
          required: false
          schema:
            type: boolean
      responses:
        "200":
          description: Items
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Item"
        "401":
          description: Authentication required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Permission denied
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    post:
      operationId: createItem
      tags: [items]
      summary: Create item
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ItemInput"
      responses:
        "201":
          description: Created item
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Item"
        "400":
          description: Invalid or duplicate item or storage location
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Authentication required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Permission denied
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /items/{itemId}:
    patch:
      operationId: updateItem
      tags: [items]
      summary: Update or disable item
      parameters:
        - name: itemId
          in: path
          required: true
          schema:
            type: number
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ItemUpdate"
      responses:
        "200":
          description: Updated item
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Item"
        "400":
          description: Invalid or duplicate item or storage location
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Authentication required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Permission denied
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Item not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    ErrorResponse:
      type: object
      properties:
        detail:
          type: string
      required:
        - detail
    MessageResponse:
      type: object
      properties:
        message:
          type: string
      required:
        - message
    LoginInput:
      type: object
      properties:
        username:
          type: string
          minLength: 1
        password:
          type: string
          minLength: 1
      required: [username, password]
    SessionUser:
      type: object
      properties:
        id:
          type: number
        username:
          type: string
        display_name:
          type: string
        role_id:
          type: number
        role_name:
          type: string
        permissions:
          type: array
          items:
            type: string
        is_active:
          type: boolean
      required: [id, username, display_name, role_id, role_name, permissions, is_active]
    User:
      type: object
      properties:
        id:
          type: number
        username:
          type: string
        display_name:
          type: string
        role_id:
          type: number
        role_name:
          type: string
        is_active:
          type: boolean
        created_at:
          type: string
          format: date-time
      required: [id, username, display_name, role_id, role_name, is_active, created_at]
    UserInput:
      type: object
      properties:
        username:
          type: string
          minLength: 3
        password:
          type: string
          minLength: 8
        display_name:
          type: string
          minLength: 1
        role_id:
          type: number
        is_active:
          type: boolean
      required: [username, password, display_name, role_id]
    UserUpdate:
      type: object
      properties:
        password:
          type: string
          minLength: 8
        display_name:
          type: string
          minLength: 1
        role_id:
          type: number
        is_active:
          type: boolean
    Role:
      type: object
      properties:
        id:
          type: number
        name:
          type: string
        display_name:
          type: string
        description:
          type: string
        permissions:
          type: array
          items:
            type: string
      required: [id, name, display_name, description, permissions]
    Permission:
      type: object
      properties:
        code:
          type: string
        display_name:
          type: string
        description:
          type: string
      required: [code, display_name, description]
    Warehouse:
      type: object
      properties:
        id:
          type: number
        name:
          type: string
        code:
          type: string
        description:
          type: string
        warehouse_type:
          type: string
          enum: [main, branch]
        is_active:
          type: boolean
      required: [id, name, code, description, warehouse_type, is_active]
    WarehouseInput:
      type: object
      properties:
        name:
          type: string
          minLength: 1
        code:
          type: string
          minLength: 1
        description:
          type: string
        warehouse_type:
          type: string
          enum: [main, branch]
        is_active:
          type: boolean
      required: [name, code, warehouse_type]
    WarehouseUpdate:
      type: object
      properties:
        name:
          type: string
          minLength: 1
        code:
          type: string
          minLength: 1
        description:
          type: string
        warehouse_type:
          type: string
          enum: [main, branch]
        is_active:
          type: boolean
    Department:
      type: object
      properties:
        id:
          type: number
        name:
          type: string
        code:
          type: string
        is_active:
          type: boolean
      required: [id, name, code, is_active]
    DepartmentInput:
      type: object
      properties:
        name:
          type: string
          minLength: 1
        code:
          type: string
          minLength: 1
        is_active:
          type: boolean
      required: [name, code]
    DepartmentUpdate:
      type: object
      properties:
        name:
          type: string
          minLength: 1
        code:
          type: string
          minLength: 1
        is_active:
          type: boolean
    StorageLocation:
      type: object
      properties:
        id:
          type: number
        warehouse_id:
          type: number
        area:
          type: string
        shelf:
          type: string
        bin:
          type: string
      required: [id, warehouse_id, area, shelf, bin]
    StorageLocationInput:
      type: object
      properties:
        area:
          type: string
          minLength: 1
        shelf:
          type: string
          minLength: 1
        bin:
          type: string
          minLength: 1
      required: [area, shelf, bin]
    Item:
      type: object
      properties:
        id:
          type: number
        code:
          type: string
        name:
          type: string
        description:
          type: string
        category:
          type: string
        unit:
          type: string
        part_number:
          type: ["string", "null"]
        minimum_level:
          type: number
        warehouse_id:
          type: number
        warehouse_name:
          type: string
        storage_location:
          oneOf:
            - $ref: "#/components/schemas/StorageLocation"
            - type: "null"
        requires_serial_number:
          type: boolean
        requires_expiry_date:
          type: boolean
        is_active:
          type: boolean
        created_at:
          type: string
          format: date-time
      required:
        - id
        - code
        - name
        - description
        - category
        - unit
        - part_number
        - minimum_level
        - warehouse_id
        - warehouse_name
        - storage_location
        - requires_serial_number
        - requires_expiry_date
        - is_active
        - created_at
    ItemInput:
      type: object
      properties:
        code:
          type: string
          minLength: 1
        name:
          type: string
          minLength: 1
        description:
          type: string
        category:
          type: string
        unit:
          type: string
          minLength: 1
        part_number:
          type: ["string", "null"]
        minimum_level:
          type: number
          minimum: 0
        warehouse_id:
          type: number
        storage_location:
          oneOf:
            - $ref: "#/components/schemas/StorageLocationInput"
            - type: "null"
        requires_serial_number:
          type: boolean
        requires_expiry_date:
          type: boolean
        is_active:
          type: boolean
      required: [code, name, unit, warehouse_id]
    ItemUpdate:
      type: object
      properties:
        code:
          type: string
          minLength: 1
        name:
          type: string
          minLength: 1
        description:
          type: string
        category:
          type: string
        unit:
          type: string
          minLength: 1
        part_number:
          type: ["string", "null"]
        minimum_level:
          type: number
          minimum: 0
        warehouse_id:
          type: number
        storage_location:
          oneOf:
            - $ref: "#/components/schemas/StorageLocationInput"
            - type: "null"
        requires_serial_number:
          type: boolean
        requires_expiry_date:
          type: boolean
        is_active:
          type: boolean
    DashboardSummary:
      type: object
      properties:
        users_total:
          type: number
        active_users:
          type: number
        roles_total:
          type: number
        permissions_total:
          type: number
      required: [users_total, active_users, roles_total, permissions_total]

