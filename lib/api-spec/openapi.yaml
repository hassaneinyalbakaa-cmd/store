        "401":
          description: Authentication required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Permission denied
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Issue request not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /issue-requests/{requestId}/issue:
    post:
      operationId: issueRequest
      tags: [issue_requests]
      summary: Issue an approved request and create a voucher
      parameters:
        - name: requestId
          in: path
          required: true
          schema:
            type: number
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/IssueRequestIssueInput"
      responses:
        "201":
          description: Issue voucher
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IssueVoucher"
        "400":
          description: Insufficient balance, serial, or invalid status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Authentication required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Permission denied
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Issue request not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /issue-requests/{requestId}/close:
    post:
      operationId: closeIssueRequest
      tags: [issue_requests]
      summary: Close an issued request
      parameters:
        - name: requestId
          in: path
          required: true
          schema:
            type: number
      responses:
        "200":
          description: Closed issue request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IssueRequest"
        "400":
          description: Invalid status transition
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Authentication required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Permission denied
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Issue request not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /issue-vouchers:
    get:
      operationId: listIssueVouchers
      tags: [issue_vouchers]
      summary: List issue vouchers
      responses:
        "200":
          description: Completed issue vouchers
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/IssueVoucher"
        "401":
          description: Authentication required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Permission denied
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /issue-vouchers/{voucherId}:
    get:
      operationId: getIssueVoucher
      tags: [issue_vouchers]
      summary: Get an issue voucher
      parameters:
        - name: voucherId
          in: path
          required: true
          schema:
            type: number
      responses:
        "200":
          description: Issue voucher
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IssueVoucher"
        "401":
          description: Authentication required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Permission denied
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Issue voucher not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
components:
  schemas:
    HealthStatus:
